let toastTimer = null;
function showToast(kind, message) {
  const el = document.getElementById("toast");
  const styles = {
    saving: { bg: "bg-white border border-[#E3DECF] text-[#5C5A52]", ic: "loader-2", icCls: "spin text-[#8FBC8F]" },
    success: { bg: "bg-[#E8F0E6] border border-[#D5E5D0] text-[#4E6B4E]", ic: "check-circle-2", icCls: "text-[#5F7A5F]" },
    error: { bg: "bg-[#F6E1DE] border border-[#EAC8C2] text-[#B0503F]", ic: "alert-triangle", icCls: "text-[#B0503F]" },
  };
  const s = styles[kind] || styles.success;
  el.className = `fixed bottom-5 right-5 z-50 toast-pop`;
  el.innerHTML = `<div class="flex items-center gap-2.5 rounded-2xl ${s.bg} px-4 py-3 shadow-lg text-sm font-semibold">
    ${icon(s.ic, s.icCls, 'style="width:16px;height:16px"')}<span>${message}</span></div>`;
  if (window.lucide) lucide.createIcons();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = "fixed bottom-5 right-5 z-50 hidden"; }, 2600);
}

/* ================= API layer (Google Apps Script) =================
   IMPORTANT: Google Apps Script Web Apps do NOT send an
   'Access-Control-Allow-Origin' header on their responses. That means
   a normal fetch() call — GET or POST — gets blocked by the browser's
   CORS policy before your JS ever sees the response, even though the
   script itself runs fine and the data really does get read/written.
   The reliable workaround is JSONP: load the URL via a <script> tag
   instead of fetch(). Script tags are not subject to CORS, and
   Code.gs wraps its JSON response in a callback() call when it sees
   a "callback" query param, which is exactly what jsonpRequest sends. */
function jsonpRequest(url) {
  return new Promise((resolve, reject) => {
    const cbName = "jsonp_cb_" + Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    let settled = false;
    const timer = setTimeout(() => {
      if (!settled) { cleanup(); reject(new Error("JSONP request timed out")); }
    }, 15000);
    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = (data) => { settled = true; cleanup(); resolve(data); };
    script.onerror = () => { if (!settled) { cleanup(); reject(new Error("JSONP script failed to load")); } };
    const sep = url.includes("?") ? "&" : "?";
    script.src = `${url}${sep}callback=${cbName}`;
    document.body.appendChild(script);
  });
}

async function sendToSheet(module, action, payload) {
  if (!IS_CONNECTED) {
    showToast("error", "Naka-preview mode — i-paste ang Apps Script URL para mag-save sa Sheets.");
    return { success: false, offline: true };
  }
  setStatus("syncing");
  showToast("saving", "Saving to Google Sheets…");
  try {
    const url = `${API_URL}?module=${encodeURIComponent(module)}&action=${encodeURIComponent(action)}&payload=${encodeURIComponent(JSON.stringify(payload))}`;
    const data = await jsonpRequest(url);
    if (data && data.success) {
      showToast("success", "Successfully Saved!");
      setStatus("saved");
    } else {
      showToast("error", (data && data.error) ? data.error : "Hindi na-save. Subukan ulit.");
      setStatus("error");
    }
    return data;
  } catch (err) {
    console.error("sendToSheet failed:", err);
    showToast("error", "Connection error. Data kept locally.");
    setStatus("error");
    return { success: false, error: String(err) };
  }
}

async function fetchAllFromSheet() {
  if (!IS_CONNECTED) { setStatus("error"); return null; }
  setStatus("syncing");
  try {
    const data = await jsonpRequest(`${API_URL}?action=list`);
    setStatus("saved");
    return data;
  } catch (err) {
    console.error("fetchAllFromSheet failed:", err);
    setStatus("error");
    return null;
  }
}

/* ================= Module 0: Overview ================= */
function greetingForNow() {
  const hour = new Date().getHours();
  if (hour < 12) return "Good Morning";
  if (hour < 18) return "Good Afternoon";
  return "Good Evening";
}

function groupTransactionsByMonth(transactions) {
  const map = {};
  transactions.forEach((t) => {
    const key = (t.date || "").slice(0, 7); // "YYYY-MM"
    if (!key) return;
    if (!map[key]) map[key] = { income: 0, expense: 0 };
    map[key][t.type] += Number(t.amount || 0);
  });
  const keys = Object.keys(map).sort().slice(-6);
  return keys.map((k) => {
    const d = new Date(k + "-01T00:00:00");
    const label = isNaN(d) ? k : d.toLocaleDateString("en-PH", { month: "short" });
    return { month: label, revenue: map[k].income, expense: map[k].expense };
  });
}

function renderOverview() {
  const thisMonthKey = todayISO.slice(0, 7);
  const thisMonthTxns = state.transactions.filter((t) => (t.date || "").startsWith(thisMonthKey));
  const revenue = thisMonthTxns.filter((t) => t.type === "income").reduce((a, t) => a + t.amount, 0);
  const expenses = thisMonthTxns.filter((t) => t.type === "expense").reduce((a, t) => a + t.amount, 0);
  const netProfit = revenue - expenses;
  const activeEmployees = state.payroll.length;

  const upcomingTask = [...state.ganap]
    .filter((g) => g.status !== "Completed")
    .sort((a, b) => (a.date || "").localeCompare(b.date || ""))[0];

  const lowStockItems = state.materials.filter((m) => m.currentStock <= m.minSafety);
  const highPriorityPending = state.ganap.filter((g) => g.priority === "High" && g.status !== "Completed");

  const stats = [
    { label: "Total Sales This Month", value: peso(revenue), icon: "shopping-bag", tone: "sage" },
    { label: "Net Profit (Kita)", value: peso(netProfit), icon: "piggy-bank", tone: "clay" },
    { label: "Active Employees", value: activeEmployees, icon: "users", tone: "sage" },
    { label: "Next Scheduled Task", value: upcomingTask ? upcomingTask.task.split(" ").slice(0, 4).join(" ") + "…" : "Wala pang naka-schedule", sub: upcomingTask ? fmtDate(upcomingTask.date) : "", icon: "calendar-days", tone: "clay" },
  ];

  const statsHtml = stats.map((s) => card(`
    <div class="p-4 sm:p-5">
      <div class="flex items-center justify-between mb-3">
        <div class="flex h-9 w-9 items-center justify-center rounded-xl ${s.tone === "sage" ? "bg-[#E8F0E6] text-[#5F7A5F]" : "bg-[#F3E3D3] text-[#9C6B3E]"}">
          ${icon(s.icon, "", 'style="width:17px;height:17px"')}
        </div>
      </div>
      <p class="text-xs font-semibold uppercase tracking-wide text-[#9A9689]">${s.label}</p>
      <p class="mt-1 font-display text-lg sm:text-xl font-bold text-[#3D3B36] leading-tight">${s.value}</p>
      ${s.sub ? `<p class="text-xs text-[#B4652E] font-medium mt-0.5">${s.sub}</p>` : ""}
    </div>`)).join("");

  const chartData = groupTransactionsByMonth(state.transactions);
  const maxChartVal = Math.max(1, ...chartData.map((d) => Math.max(d.revenue, d.expense)));
  const bars = chartData.length === 0
    ? `<p class="text-sm text-[#9A9689] self-center mx-auto">Wala pang datos sa Kita vs Gastos — mag-add ng entry para makita dito.</p>`
    : chartData.map((d) => `
      <div class="flex-1 flex flex-col items-center gap-2 h-full justify-end">
        <div class="flex items-end gap-1 h-full w-full justify-center">
          <div class="w-3 sm:w-4 rounded-t-lg bg-[#8FBC8F] transition-all hover:brightness-95" style="height:${(d.revenue / maxChartVal) * 100}%" title="Revenue: ${peso(d.revenue)}"></div>
          <div class="w-3 sm:w-4 rounded-t-lg bg-[#D89B6A] transition-all hover:brightness-95" style="height:${(d.expense / maxChartVal) * 100}%" title="Expenses: ${peso(d.expense)}"></div>
        </div>
        <span class="text-[11px] sm:text-xs font-medium text-[#9A9689]">${d.month}</span>
      </div>`).join("");

  const lowStockNotifs = lowStockItems.map((item) => `
    <div class="flex items-start gap-2.5 rounded-2xl bg-[#FBE7D6] p-3">
      ${icon("alert-triangle", "mt-0.5 shrink-0 text-[#B4652E]", 'style="width:16px;height:16px"')}
      <p class="text-sm text-[#8A5A2E] leading-snug">Low on <span class="font-semibold">${item.name}</span>! Only ${item.currentStock} left, at or below the safety level.</p>
    </div>`).join("");

  const priorityNotifs = highPriorityPending.slice(0, 3).map((g) => `
    <div class="flex items-start gap-2.5 rounded-2xl bg-[#F6E1DE] p-3">
      ${icon("flame", "mt-0.5 shrink-0 text-[#B0503F]", 'style="width:16px;height:16px"')}
      <p class="text-sm text-[#8A4A3E] leading-snug">High priority: <span class="font-semibold">${g.task}</span> — ${g.status}.</p>
    </div>`).join("");

  const noReminders = !lowStockItems.length && !highPriorityPending.length;

  return `
    <div class="mb-6">
      <div class="flex items-start gap-3 mb-1">
        <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-[#E8F0E6] text-[#5F7A5F] shadow-inner shrink-0">
          ${icon("home", "", 'style="width:20px;height:20px;stroke-width:2.2"')}
        </div>

/* ================= Module 1: Weekly Payroll ================= */
function computePayroll(p) {
  const days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
  const daysPresent = days.reduce((n, d) => n + (p[d] ? 1 : 0), 0);
  const basePay = daysPresent * Number(p.dailyRate || 0);
  const overtimePay = Number(p.overtimeHours || 0) * (Number(p.dailyRate || 0) / 8) * 1.25;
  const grossPay = basePay + overtimePay;
  const netPay = grossPay - Number(p.deductions || 0);
  return { daysPresent, basePay, overtimePay, grossPay, netPay };
}

        <p class="text-xs text-[#6B8E6B] mt-4 leading-relaxed">Formula: Retail Price = Cost to Make ÷ (1 − Margin).</p>
        <div class="mt-5 pt-4 border-t border-[#D5E5D0]">
          <p class="text-xs font-semibold uppercase tracking-wide text-[#5F7A5F] mb-2">Recently Saved</p>
          <div class="space-y-2">${history}</div>
        </div>
      </div>`, "xl:col-span-2 bg-[#E8F0E6]/60 border-[#D5E5D0]")}
    </div>`;
}

const PAGE_RENDERERS = {
  overview: renderOverview, payroll: renderPayroll, ganap: renderGanap, budget: renderBudget,
  materials: renderMaterials, pricing: renderPricing,
};

/* ================= Core render ================= */
function render() {
  document.getElementById("sidebar-nav").innerHTML = NAV_ITEMS.map(item => {
    const active = state.page === item.key;
    return `<button data-action="go-page" data-id="${item.key}"
      class="group flex w-full items-center gap-3 rounded-2xl px-3.5 py-3 text-sm font-medium transition-all ${active ? "bg-[#8FBC8F] text-white shadow-sm" : "text-[#5C5A52] hover:bg-[#E8F0E6]"}">
      ${icon(item.icon, active ? "text-white" : "text-[#7CA57C]", 'style="width:18px;height:18px;stroke-width:2.2"')}
      <span class="text-left leading-tight">${item.emoji} ${item.label}</span>
      ${active ? icon("chevron-right", "ml-auto", 'style="width:15px;height:15px"') : ""}
    </button>`;
  }).join("");

  document.getElementById("header-title").textContent = NAV_ITEMS.find(n => n.key === state.page)?.label || "";
  document.getElementById("app-main").innerHTML = `<div class="fade-in">${PAGE_RENDERERS[state.page]()}</div>`;

  const sidebar = document.getElementById("sidebar");
  const backdrop = document.getElementById("sidebar-backdrop");
  if (state.sidebarOpen) {
    sidebar.classList.remove("-translate-x-full");
    backdrop.classList.remove("hidden");
  } else {
    sidebar.classList.add("-translate-x-full");
    backdrop.classList.add("hidden");
  }

  if (window.lucide) lucide.createIcons();
  attachDynamicListeners();
}

function attachDynamicListeners() {
  if (state.page === "pricing") {
    const map = { "price-materials": "materialsCost", "price-labor": "laborCost", "price-overhead": "overheadCost" };
    Object.keys(map).forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener("input", () => { state.pricing[map[id]] = Number(el.value || 0); updatePricingResults(); });
    });
    const labelEl = document.getElementById("price-label");
    if (labelEl) labelEl.addEventListener("input", () => { state.pricing.savedLabel = labelEl.value; });
    const marginEl = document.getElementById("price-margin");
    if (marginEl) marginEl.addEventListener("input", () => {
      state.pricing.margin = Number(marginEl.value);
      document.getElementById("margin-display").textContent = state.pricing.margin + "%";
      updatePricingResults();
    });
  }
}

function updatePricingResults() {
  const p = state.pricing;
  const cost = Number(p.materialsCost || 0) + Number(p.laborCost || 0) + Number(p.overheadCost || 0);
  const price = p.margin < 100 ? cost / (1 - p.margin / 100) : cost;
  const profit = price - cost;
  document.getElementById("price-cost").textContent = peso(cost);
  document.getElementById("price-retail").textContent = peso(price);
  document.getElementById("price-profit").textContent = peso(profit);
}

/* ================= Action handlers (event delegation) =================
   Every handler that adds/removes real data calls sendToSheet(...) so the
   change is POSTed to your Google Sheet through Code.gs. e.preventDefault()
   equivalent: we never use a real <form> tag, all buttons are type="button"
   handled purely via JS, so there is never a page reload on save. */
const handlers = {
  "go-page": (id) => { state.page = id; state.sidebarOpen = false; render(); },
  "toggle-sidebar": () => { state.sidebarOpen = !state.sidebarOpen; render(); },

  /* --- Payroll --- */
  "toggle-payroll-form": () => { state.showPayrollForm = !state.showPayrollForm; render(); },
  "cancel-payroll-form": () => { state.showPayrollForm = false; render(); },
  "add-payroll": async () => {
    const name = document.getElementById("pr-name").value.trim();
    const dailyRate = Number(document.getElementById("pr-rate").value || 0);
    if (!name || !dailyRate) return;
    const entry = {
      id: uid(), name, dailyRate,
      mon: document.getElementById("pr-mon").checked, tue: document.getElementById("pr-tue").checked,
      wed: document.getElementById("pr-wed").checked, thu: document.getElementById("pr-thu").checked,
      fri: document.getElementById("pr-fri").checked, sat: document.getElementById("pr-sat").checked,
      sun: document.getElementById("pr-sun").checked,
      overtimeHours: Number(document.getElementById("pr-ot").value || 0),
      deductions: Number(document.getElementById("pr-ded").value || 0),
    };
    state.payroll.push(entry);
    state.showPayrollForm = false;
    render();
    const calc = computePayroll(entry);
    await sendToSheet("payroll", "add", { ...entry, ...calc, dateLogged: todayISO });
  },
  "remove-payroll": async (id) => {
    state.payroll = state.payroll.filter(p => p.id !== id);
    render();
    await sendToSheet("payroll", "delete", { id });
  },

  /* --- Ganap Hub --- */
  "toggle-ganap-form": () => { state.showGanapForm = !state.showGanapForm; render(); },
  "cancel-ganap-form": () => { state.showGanapForm = false; render(); },
  "add-ganap": async () => {
    const date = document.getElementById("gp-date").value || todayISO;
    const task = document.getElementById("gp-task").value.trim();
    const assignedTo = document.getElementById("gp-assigned").value.trim();
    const priority = document.getElementById("gp-priority").value;
    const status = document.getElementById("gp-status").value;
    if (!task) return;
    const entry = { id: uid(), date, task, assignedTo, priority, status };
    state.ganap.push(entry);
    state.showGanapForm = false;
    render();
    await sendToSheet("ganap", "add", entry);
  },
  "cycle-ganap-status": async (id) => {
    const order = ["Pending", "In Progress", "Completed"];
    const item = state.ganap.find(g => g.id === id);
    if (!item) return;
    item.status = order[(order.indexOf(item.status) + 1) % order.length];
    render();
    await sendToSheet("ganap", "update", { id, status: item.status });
  },
  "remove-ganap": async (id) => {
    state.ganap = state.ganap.filter(g => g.id !== id);
    render();
    await sendToSheet("ganap", "delete", { id });
  },

  /* --- Kita vs Gastos --- */
  "toggle-txn-form": () => { state.showTxnForm = !state.showTxnForm; render(); },
  "cancel-txn-form": () => { state.showTxnForm = false; render(); },
  "add-txn": async () => {
    const date = document.getElementById("txn-date").value || todayISO;
    const category = document.getElementById("txn-category").value.trim();
    const description = document.getElementById("txn-description").value.trim();
    const type = document.getElementById("txn-type").value;
    const amount = Number(document.getElementById("txn-amount").value || 0);
    if (!category || !amount) return;
    const entry = { id: uid(), date, category, description, type, amount };
    state.transactions.unshift(entry);
    state.showTxnForm = false;
    render();
    await sendToSheet("budget", "add", entry);
  },
  "remove-txn": async (id) => {
    state.transactions = state.transactions.filter(t => t.id !== id);
    render();
    await sendToSheet("budget", "delete", { id });
  },

  /* --- Materials & Stock --- */
  "toggle-material-form": () => { state.showMaterialForm = !state.showMaterialForm; render(); },
  "cancel-material-form": () => { state.showMaterialForm = false; render(); },
  "add-material": async () => {
    const name = document.getElementById("mt-name").value.trim();
    const category = document.getElementById("mt-category").value.trim();
    const unitCost = Number(document.getElementById("mt-cost").value || 0);
    const currentStock = Number(document.getElementById("mt-stock").value || 0);
    const minSafety = Number(document.getElementById("mt-min").value || 0);
    if (!name) return;
    const entry = { id: uid(), name, category, unitCost, currentStock, minSafety };
    state.materials.push(entry);
    state.showMaterialForm = false;
    render();
    await sendToSheet("materials", "add", entry);
    if (currentStock <= minSafety) showToast("error", `Reorder alert: ${name} is at or below its safety level.`);
  },
  "remove-material": async (id) => {
    state.materials = state.materials.filter(m => m.id !== id);
    render();
    await sendToSheet("materials", "delete", { id });
  },

  /* --- Pricing Calculator --- */
  "save-pricing": async () => {
    const p = state.pricing;
    const cost = Number(p.materialsCost || 0) + Number(p.laborCost || 0) + Number(p.overheadCost || 0);
    const retailPrice = p.margin < 100 ? cost / (1 - p.margin / 100) : cost;
    const label = document.getElementById("price-label").value.trim() || "Untitled item";
    const entry = { id: uid(), label, materialsCost: p.materialsCost, laborCost: p.laborCost, overheadCost: p.overheadCost, margin: p.margin, retailPrice };
    state.pricingHistory.unshift(entry);
    p.savedPrice = retailPrice;
    p.savedLabel = label;
    render();
    await sendToSheet("pricing", "add", { ...entry, dateSaved: todayISO });
  },
};

document.body.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  if (handlers[action]) handlers[action](id);
});
document.getElementById("menu-btn").addEventListener("click", () => handlers["toggle-sidebar"]());
document.getElementById("sidebar-backdrop").addEventListener("click", () => handlers["toggle-sidebar"]());
document.getElementById("sidebar-close-btn").addEventListener("click", () => handlers["toggle-sidebar"]());

/* ================= Init: try to load real data from Google Sheets ================= */
async function init() {
  render();
  if (!IS_CONNECTED) { setStatus("error"); return; }
  const data = await fetchAllFromSheet();
  if (data) {
    if (Array.isArray(data.payroll) && data.payroll.length) state.payroll = data.payroll;
    if (Array.isArray(data.ganap) && data.ganap.length) state.ganap = data.ganap;
    if (Array.isArray(data.budget) && data.budget.length) state.transactions = data.budget;
    if (Array.isArray(data.materials) && data.materials.length) state.materials = data.materials;
    if (Array.isArray(data.pricing) && data.pricing.length) state.pricingHistory = data.pricing;
    render();
  }
}
init();
</script>
</body>
